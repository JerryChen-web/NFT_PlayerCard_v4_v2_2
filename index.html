<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>動態球員卡收藏 v2</title>
  <style>
    :root{
      --bg:#11110f;
      --bg-soft:#171815;
      --surface:#1f211d;
      --surface-2:#282a25;
      --surface-3:#303329;
      --ink:#f7f2e8;
      --muted:#b9b0a4;
      --dim:#80786d;
      --line:rgba(247,242,232,.15);
      --line-strong:rgba(247,242,232,.26);
      --gold:#e6b85c;
      --teal:#3fd0c9;
      --red:#e55d4f;
      --green:#78c66d;
      --blue:#6aa7ff;
      --violet:#b590ff;
      --paper:#f4ead9;
      --paper-ink:#201b15;
      --shadow:0 18px 46px rgba(0,0,0,.32);
      --radius:8px;
      --font-sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
      --font-mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html{overflow-x:hidden}
    body{
      margin:0;
      color:var(--ink);
      background:
        linear-gradient(120deg, rgba(63,208,201,.11), transparent 34%),
        linear-gradient(250deg, rgba(230,184,92,.12), transparent 40%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 26px),
        var(--bg);
      font-family:var(--font-sans);
      overflow:hidden;
      overflow-x:hidden;
    }

    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    a{color:inherit}
    img{display:block;max-width:100%}

    .app-shell{
      height:100vh;
      width:100%;
      max-width:100%;
      display:grid;
      grid-template-columns:268px minmax(0,1fr);
      isolation:isolate;
    }

    .sidebar{
      display:flex;
      flex-direction:column;
      min-height:0;
      min-width:0;
      padding:18px;
      background:
        linear-gradient(180deg, rgba(31,33,29,.98), rgba(17,17,15,.98)),
        repeating-linear-gradient(0deg, transparent 0 14px, rgba(255,255,255,.025) 14px 15px);
      border-right:1px solid var(--line);
      box-shadow:16px 0 44px rgba(0,0,0,.25);
      z-index:2;
    }

    .brand{
      display:grid;
      grid-template-columns:48px minmax(0,1fr);
      gap:12px;
      align-items:center;
      padding:6px 0 18px;
      border-bottom:1px solid var(--line);
    }

    .brand-mark{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      border-radius:8px;
      color:#16120c;
      font-weight:900;
      letter-spacing:.5px;
      background:linear-gradient(135deg,var(--teal),var(--gold) 56%,var(--red));
      box-shadow:0 14px 30px rgba(230,184,92,.18);
    }

    .brand h1{
      margin:0;
      font-size:19px;
      line-height:1.15;
      letter-spacing:0;
    }
    .brand p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
      padding:16px 0;
      overflow:auto;
    }

    .nav-btn{
      display:grid;
      grid-template-columns:32px minmax(0,1fr);
      align-items:center;
      gap:10px;
      width:100%;
      min-height:48px;
      color:var(--muted);
      background:transparent;
      border:1px solid transparent;
      border-radius:8px;
      padding:8px;
      text-align:left;
      transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
    }
    .nav-btn:hover{background:rgba(255,255,255,.055);color:var(--ink);transform:translateX(2px)}
    .nav-btn.active{
      color:var(--ink);
      background:linear-gradient(135deg, rgba(63,208,201,.16), rgba(230,184,92,.13));
      border-color:rgba(230,184,92,.36);
    }
    .nav-ico{
      width:32px;
      height:32px;
      display:grid;
      place-items:center;
      border-radius:8px;
      background:rgba(255,255,255,.08);
      color:var(--gold);
      font-weight:850;
    }
    .nav-btn strong{
      display:block;
      font-size:14px;
      line-height:1.1;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .nav-btn small{
      display:block;
      margin-top:3px;
      color:var(--dim);
      font-size:11px;
      line-height:1.1;
    }

    .wallet{
      margin-top:auto;
      border:1px solid var(--line);
      border-radius:8px;
      background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
      overflow:hidden;
    }
    .wallet-main{padding:14px}
    .wallet-label{
      display:flex;
      justify-content:space-between;
      gap:10px;
      color:var(--dim);
      font-family:var(--font-mono);
      font-size:11px;
      letter-spacing:.3px;
    }
    .wallet-value{
      display:flex;
      align-items:baseline;
      gap:7px;
      margin:8px 0 10px;
      font-family:var(--font-mono);
      font-size:28px;
      color:#fff;
    }
    .wallet-value small{font-size:13px;color:var(--muted)}
    .meter{
      height:7px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      overflow:hidden;
    }
    .meter span{
      display:block;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,var(--red),var(--gold),var(--teal));
    }
    .wallet-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      padding:0 14px 14px;
    }

    .main{
      display:flex;
      min-width:0;
      min-height:0;
      flex-direction:column;
    }

    .topbar{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:18px;
      align-items:center;
      min-height:78px;
      padding:14px 24px;
      border-bottom:1px solid var(--line);
      background:rgba(23,24,21,.78);
      backdrop-filter:blur(16px);
      z-index:1;
    }
    .page-title{
      display:grid;
      grid-template-columns:42px minmax(0,1fr);
      gap:12px;
      align-items:center;
      min-width:0;
    }
    .page-seal{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border-radius:8px;
      color:var(--paper-ink);
      font-weight:900;
      background:linear-gradient(135deg,var(--gold),var(--paper));
      border:1px solid rgba(255,255,255,.18);
    }
    .page-title h2{
      margin:0;
      font-size:22px;
      line-height:1.16;
      letter-spacing:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .page-title p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .top-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
    }

    .view-wrap{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:22px 24px 30px;
      width:100%;
      max-width:1760px;
      margin:0 auto;
    }
    .view{display:none}
    .view.active{display:block;animation:fadeIn .22s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    .grid{display:grid;gap:14px}
    .cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .align-start{align-items:start}
    .mt-14{margin-top:14px}
    .mt-18{margin-top:18px}
    .mb-0{margin-bottom:0}

    .panel{
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(31,33,29,.88);
      box-shadow:var(--shadow);
    }
    .panel-pad{padding:18px}
    .panel h3,.panel h4{margin:0;color:#fff;letter-spacing:0}
    .panel h3{font-size:20px;line-height:1.2}
    .panel h4{font-size:15px;line-height:1.25}
    .panel p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.65}

    .hero-grid{
      display:grid;
      grid-template-columns:minmax(0,1.18fr) minmax(310px,.82fr);
      gap:14px;
      align-items:stretch;
    }
    .brief{
      display:grid;
      gap:18px;
      align-content:space-between;
      min-height:420px;
      padding:22px;
      background:
        linear-gradient(135deg, rgba(63,208,201,.13), transparent 34%),
        linear-gradient(290deg, rgba(229,93,79,.13), transparent 44%),
        rgba(31,33,29,.9);
    }
    .brief-kicker{
      display:inline-flex;
      width:max-content;
      max-width:100%;
      gap:8px;
      align-items:center;
      border:1px solid rgba(230,184,92,.34);
      border-radius:8px;
      padding:7px 9px;
      color:var(--gold);
      background:rgba(230,184,92,.08);
      font-size:12px;
      font-weight:800;
    }
    .brief h2{
      margin:0;
      max-width:780px;
      font-size:38px;
      line-height:1.08;
      letter-spacing:0;
      color:#fff;
    }
    .brief p{
      max-width:780px;
      font-size:15px;
    }
    .pipeline{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:8px;
    }
    .pipe-step{
      min-height:84px;
      padding:10px;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,255,255,.05);
    }
    .pipe-step b{display:block;color:#fff;font-size:13px}
    .pipe-step span{display:block;margin-top:6px;color:var(--muted);font-size:12px;line-height:1.35}

    .stat-tile{
      min-height:118px;
      padding:16px;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,255,255,.045);
    }
    .stat-tile span{display:block;color:var(--dim);font-size:12px}
    .stat-tile strong{
      display:block;
      margin-top:10px;
      color:#fff;
      font-family:var(--font-mono);
      font-size:28px;
      line-height:1;
      overflow-wrap:anywhere;
    }
    .stat-tile p{font-size:12px}

    .card-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
      gap:14px;
    }

    .player-card{
      position:relative;
      min-width:0;
      overflow:hidden;
      border:1px solid color-mix(in srgb, var(--rarity-color, var(--line-strong)) 45%, var(--line));
      border-radius:8px;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--team-a, #3fd0c9) 18%, transparent), transparent 38%),
        linear-gradient(315deg, color-mix(in srgb, var(--team-b, #e6b85c) 16%, transparent), transparent 48%),
        var(--surface);
      box-shadow:0 18px 44px rgba(0,0,0,.28);
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    }
    .player-card:hover{
      transform:translateY(-2px);
      border-color:color-mix(in srgb, var(--rarity-color, var(--gold)) 65%, white 5%);
      box-shadow:0 22px 54px rgba(0,0,0,.36);
    }
    .player-card.effect-goal,.player-card.effect-homer,.player-card.effect-award{
      animation:pulseGlow 1.1s ease both;
    }
    @keyframes pulseGlow{
      0%{box-shadow:0 0 0 rgba(230,184,92,0)}
      34%{box-shadow:0 0 0 4px color-mix(in srgb, var(--rarity-color, var(--gold)) 45%, transparent),0 22px 64px rgba(0,0,0,.42)}
      100%{box-shadow:0 18px 44px rgba(0,0,0,.28)}
    }

    .card-topline{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      padding:11px 12px;
      min-height:46px;
      border-bottom:1px solid var(--line);
      background:rgba(0,0,0,.16);
    }
    .serial{
      color:var(--muted);
      font-family:var(--font-mono);
      font-size:11px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .rarity-pill,.status-pill,.badge,.source-pill{
      display:inline-flex;
      align-items:center;
      min-height:25px;
      max-width:100%;
      border:1px solid var(--line);
      border-radius:8px;
      padding:4px 8px;
      color:#fff;
      background:rgba(255,255,255,.07);
      font-size:11px;
      font-weight:800;
      line-height:1.2;
      overflow-wrap:anywhere;
    }
    .rarity-pill{border-color:color-mix(in srgb, var(--rarity-color, var(--gold)) 55%, var(--line));color:var(--rarity-color,var(--gold))}
    .status-pill.warning{border-color:rgba(229,93,79,.48);color:#ffb1a8;background:rgba(229,93,79,.11)}
    .status-pill.special{border-color:rgba(120,198,109,.48);color:#bdf5b7;background:rgba(120,198,109,.11)}

    .media-frame{
      position:relative;
      height:248px;
      overflow:hidden;
      background:
        linear-gradient(150deg, color-mix(in srgb, var(--team-a,#3fd0c9) 42%, #20221e), color-mix(in srgb, var(--team-b,#e6b85c) 34%, #11110f)),
        var(--surface-2);
    }
    .media-frame::after{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height:58%;
      background:linear-gradient(180deg, transparent, rgba(0,0,0,.72));
      pointer-events:none;
    }
    .media-frame img.player-img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center top;
      filter:saturate(1.08) contrast(1.03);
    }
    .media-frame.is-fallback img.player-img{display:none}
    .fallback-initials{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:rgba(255,255,255,.88);
      font-weight:950;
      font-size:58px;
      letter-spacing:0;
      text-shadow:0 4px 22px rgba(0,0,0,.36);
    }
    .media-frame:not(.is-fallback) .fallback-initials{display:none}
    .team-logo{
      position:absolute;
      right:12px;
      bottom:12px;
      width:54px;
      height:54px;
      z-index:2;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.38);
      border-radius:8px;
      background:rgba(255,255,255,.9);
      box-shadow:0 10px 26px rgba(0,0,0,.28);
      overflow:hidden;
    }
    .team-logo img{
      width:42px;
      height:42px;
      object-fit:contain;
    }
    .team-logo.logo-failed::before{
      content:attr(data-code);
      color:#1c1710;
      font-weight:900;
      font-size:13px;
    }
    .media-label{
      position:absolute;
      left:12px;
      bottom:12px;
      z-index:2;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      max-width:calc(100% - 82px);
    }

    .card-body{
      display:grid;
      gap:12px;
      padding:14px;
    }
    .name-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:start;
      gap:10px;
    }
    .player-name{
      margin:0;
      color:#fff;
      font-size:22px;
      line-height:1.08;
      letter-spacing:0;
      overflow-wrap:anywhere;
    }
    .team-line{
      margin:5px 0 0;
      color:var(--muted);
      font-size:12px;
      line-height:1.35;
    }
    .number-chip{
      min-width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:1px solid var(--line);
      border-radius:8px;
      color:#fff;
      background:rgba(0,0,0,.18);
      font-family:var(--font-mono);
      font-weight:900;
    }
    .badge-row{display:flex;flex-wrap:wrap;gap:6px}
    .stats{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    .stat-box{
      min-height:62px;
      border:1px solid var(--line);
      border-radius:8px;
      padding:8px;
      background:rgba(255,255,255,.045);
    }
    .stat-box span{
      display:block;
      color:var(--dim);
      font-size:10px;
      font-family:var(--font-mono);
      line-height:1.1;
      text-transform:uppercase;
    }
    .stat-box b{
      display:block;
      margin-top:7px;
      color:#fff;
      font-size:18px;
      line-height:1;
      font-family:var(--font-mono);
      overflow-wrap:anywhere;
    }
    .value-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      color:var(--muted);
      font-size:12px;
    }
    .value-row b{
      color:#fff;
      font-family:var(--font-mono);
      font-size:14px;
    }
    .card-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .card-actions.three{grid-template-columns:1fr 1fr 1fr}

    .btn,.icon-btn,.field,.select,.search{
      min-height:38px;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,255,255,.07);
      color:var(--ink);
      outline:none;
    }
    .btn,.icon-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:8px 11px;
      font-size:13px;
      font-weight:800;
      line-height:1.15;
      transition:background .18s ease,border-color .18s ease,transform .18s ease,filter .18s ease;
    }
    .btn:hover,.icon-btn:hover{background:rgba(255,255,255,.12);border-color:var(--line-strong);transform:translateY(-1px)}
    .btn.primary{
      color:#16120c;
      border-color:rgba(230,184,92,.58);
      background:linear-gradient(135deg,var(--gold),#f1dfb6);
    }
    .btn.teal{
      color:#071312;
      border-color:rgba(63,208,201,.56);
      background:linear-gradient(135deg,var(--teal),#c9f1ef);
    }
    .btn.danger{
      color:#ffe9e6;
      border-color:rgba(229,93,79,.44);
      background:rgba(229,93,79,.16);
    }
    .icon-btn{
      width:38px;
      padding:0;
      font-family:var(--font-mono);
    }
    .field,.select,.search{
      width:100%;
      padding:8px 10px;
      font-size:13px;
      background:rgba(255,255,255,.08);
    }
    .field:focus,.select:focus,.search:focus{border-color:rgba(63,208,201,.72);box-shadow:0 0 0 3px rgba(63,208,201,.12)}
    .search{min-width:220px}
    .select{min-width:150px}

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
      margin-bottom:14px;
    }
    .section-head h3{margin:0;color:#fff;font-size:22px}
    .section-head p{max-width:760px;margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
    .section-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

    .oracle-layout{
      display:grid;
      grid-template-columns:minmax(280px,370px) minmax(0,1fr);
      gap:14px;
      align-items:start;
    }
    .event-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      gap:10px;
    }
    .event-btn{
      justify-content:flex-start;
      min-height:78px;
      padding:12px;
      text-align:left;
      background:rgba(255,255,255,.055);
    }
    .event-btn .event-icon{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border-radius:8px;
      background:rgba(230,184,92,.14);
      color:var(--gold);
      font-weight:900;
    }
    .event-btn strong{display:block;color:#fff;font-size:13px}
    .event-btn span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.35}

    .json-box{
      max-height:460px;
      overflow:auto;
      margin:0;
      padding:14px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#0c0d0b;
      color:#d8f7e4;
      font-family:var(--font-mono);
      font-size:12px;
      line-height:1.55;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .timeline{
      display:grid;
      gap:8px;
      max-height:360px;
      overflow:auto;
      padding-right:4px;
    }
    .log-line{
      border:1px solid var(--line);
      border-radius:8px;
      padding:10px;
      background:rgba(255,255,255,.045);
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .log-line b{display:block;color:#fff;margin-bottom:3px}

    table{
      width:100%;
      border-collapse:collapse;
      overflow:hidden;
      border-radius:8px;
      font-size:13px;
    }
    th,td{
      padding:10px;
      border-bottom:1px solid var(--line);
      vertical-align:top;
      text-align:left;
      line-height:1.5;
    }

    function buildStarterCards(){
      enrichCards(FeaturedCards);
      const cards = [...FeaturedCards];
      const existing = new Set(cards.map((card) => card.playerName));
      Object.entries(TopRosters).forEach(([sport, rows]) => {
        let rank = cards.filter((card) => card.sport === sport).length + 1;
        rows.forEach((row) => {
          if(cards.filter((card) => card.sport === sport).length >= 50) return;
          if(existing.has(row[0])) return;
          const card = makeGeneratedCard(sport, row, rank);
          cards.push(card);
          existing.add(card.playerName);
          rank += 1;
        });
      });
      return cards;
    }

    function enrichCards(cards){
      cards.forEach((card, index) => enrichCard(card, index + 1));
    }

    function makeGeneratedCard(sport, row, rank){
      const [playerName, team, league, position, jerseyNumber, nationality, continent] = row;
      const code = sport === "soccer" ? "SC" : sport === "basketball" ? "BK" : "BB";
      const rarity = rarityByRank(rank);
      const card = {
        id:`card_${sport}_${slug(playerName)}`,
        tokenId:`DSP-2026-${code}-${String(rank).padStart(3,"0")}`,
        sport, playerName, team, teamCode:teamCode(team), league, position, jerseyNumber, nationality, continent,
        rarity, price:priceByRank(rank, sport), owner:null, serial:`${code}-${String(rank).padStart(3,"0")}/${rarity === "oneOfOne" ? "001" : rarity === "limited" ? "500" : rarity === "legendary" ? "700" : "1500"}`,
        status:"Active", version:1, lastUpdate:"2026-05-20T00:00:00+08:00",
        imageUrl:"", logoUrl:"", teamColors:teamColors(team, sport), badges:badgesFor(sport, position, rank),
        stats:statsByRank(sport, rank, position),
        metadata:{sourceUrl:leagueHub(sport), dataSource:"demo; pending official verification; needs source verification", animationUrl:`dsp-player-card-v2.html#${slug(playerName)}`},
        history:[{at:"2026-05-20T00:00:00+08:00", type:"SEED_PENDING_VERIFY", note:"Expanded demo roster card generated from public top-player context; official biography/social verification pending."}],
        licenseNote:"Demo roster entry. Official images, marks, social accounts and live statistics require formal rights verification before commercial use."
      };
      enrichCard(card, rank);
      return card;
    }

    function enrichCard(card, rank = 25){
      card.birthDate = card.birthDate || "pending official verification";
      card.birthPlace = card.birthPlace || "pending official verification";
      card.height = card.height || "pending official verification";
      card.weight = card.weight || "pending official verification";
      card.skills = card.skills || skillsFor(card.sport, card.position, rank);
      card.abilityStats = card.abilityStats || abilityFor(card.sport, card.position, card.rarity, rank);
      card.majorAwards = card.majorAwards || awardsFor(card.sport, rank, card.playerName);
      card.records = card.records || recordsFor(card.sport, rank, card.playerName);
      card.careerHighlights = card.careerHighlights || highlightsFor(card);
      card.playStyle = card.playStyle || playStyleFor(card);
      card.collectorValue = card.collectorValue || collectorTextFor(card);
      card.careerSummary = card.careerSummary || summaryFor(card);
      card.biography = card.biography || biographyFor(card);
      card.socialLinks = {...emptySocialLinks(), ...(VerifiedSocials[card.playerName] || {}), ...(card.socialLinks || {})};
      card.officialSources = card.officialSources || officialSourcesFor(card);
      card.marketData = card.marketData || marketDataFor(card);
      card.metadata = {...(card.metadata || {}), tokenURI:`ipfs://demo/dynamic-player-card/${card.tokenId}`};
      card.metadataVersions = card.metadataVersions || [{version:card.version || 1, at:card.lastUpdate || nowISO(), reason:"Initial metadata snapshot"}];
      card.sourceStatus = card.sourceStatus || (VerifiedSocials[card.playerName] ? "seed profile partly verified from official/league pages" : "demo; pending official verification; needs source verification");
      return card;
    }

    // StarterCards is initialized after the featured card seed list below.

    function rarityByRank(rank){
      if(rank === 1) return "oneOfOne";
      if(rank <= 3) return "limited";
      if(rank <= 7) return "mythic";
      if(rank <= 14) return "legendary";
      if(rank <= 22) return "epic";
      if(rank <= 32) return "superRare";
      if(rank <= 42) return "rare";
      if(rank <= 48) return "uncommon";
      return "common";
    }

    function priceByRank(rank, sport){
      const base = sport === "basketball" ? .42 : sport === "baseball" ? .38 : .4;
      return Number((base + Math.max(0, 52 - rank) * .037).toFixed(2));
    }

    function statsByRank(sport, rank, position){
      const boost = Math.max(0, 54 - rank);
      if(sport === "soccer") return {goals:Math.round(5 + boost * .72), assists:Math.round(3 + boost * .36), appearances:Math.round(18 + boost * .18), shots:Math.round(30 + boost * 1.8), passPct:Number((78 + boost * .28).toFixed(1)), minutes:Math.round(1120 + boost * 34)};
      if(sport === "basketball") return {points:Number((15 + boost * .32).toFixed(1)), rebounds:Number((3.8 + boost * .14).toFixed(1)), assists:Number((3.2 + boost * .13).toFixed(1)), steals:Number((.7 + boost * .012).toFixed(1)), blocks:Number((.3 + boost * .012).toFixed(1)), fgPct:Number((43 + boost * .18).toFixed(1))};
      const pitcher = /Pitcher/i.test(position);
      if(pitcher) return {avg:0, homeRuns:0, rbi:0, ops:0, era:Number((3.7 - boost * .032).toFixed(2)), whip:Number((1.25 - boost * .006).toFixed(2)), strikeouts:Math.round(120 + boost * 3.5)};
      return {avg:Number((.245 + boost * .0017).toFixed(3)), homeRuns:Math.round(14 + boost * .63), rbi:Math.round(52 + boost * 1.25), ops:Number((.735 + boost * .0062).toFixed(3)), stolenBases:Math.round(4 + boost * .36), strikeouts:0};
    }

    function abilityFor(sport, position, rarity, rank){
      const tier = Rarity[rarity]?.weight || 1;
      const top = Math.round(98 - rank * .55 + tier * 1.3);
      const archetype = /Goalkeeper|Pitcher|Center Back|Defensive|Catcher/i.test(position) ? "defense" : /Winger|Guard|Shortstop|Outfield/i.test(position) ? "speed" : /Striker|Forward|DH|First Base/i.test(position) ? "attack" : "skill";
      const base = clamp(top, 72, 99);
      return {
        ovr:base,
        attack:clamp(base + (archetype === "attack" ? 4 : sport === "baseball" ? 2 : 0), 55, 99),
        defense:clamp(base + (archetype === "defense" ? 4 : -2), 50, 99),
        speed:clamp(base + (archetype === "speed" ? 4 : -1), 50, 99),
        skill:clamp(base + (archetype === "skill" ? 4 : 1), 55, 99),
        stamina:clamp(base - 1 + (rank < 15 ? 2 : 0), 55, 99),
        clutch:clamp(base + (rank < 10 ? 4 : 0), 55, 99),
        potential:clamp(base + (rank > 20 ? 3 : 1), 55, 99),
        marketHeat:clamp(94 - rank * .6 + tier * 2, 45, 99)
      };
    }

    function skillsFor(sport, position, rank){
      const pool = sport === "soccer"
        ? ["Vision Pass","Finisher","Golden Boot DNA","Captain Mentality","Speed Demon","Defensive Wall","Playmaker","Record Breaker"]
        : sport === "basketball"
          ? ["Deep Range","Triple-Double Engine","Clutch Shot","Two-Way Legend","Playmaker","Defensive Wall","Finisher","Captain Mentality"]
          : ["Power Hitter","Home Run Threat","Record Breaker","Clutch Shot","Speed Demon","Defensive Wall","Playmaker","Captain Mentality"];
      const offset = Math.abs(hashCode(position)) % pool.length;
      const count = rank < 10 ? 4 : rank < 28 ? 3 : 2;
      return Array.from({length:count}, (_, index) => pool[(offset + index) % pool.length]);
    }

    function badgesFor(sport, position, rank){
      const first = sport === "soccer" ? "Global XI" : sport === "basketball" ? "All-NBA Tier" : "All-Star Tier";
      const role = /Goalkeeper|Pitcher|Catcher|Defensive|Back|Center/i.test(position) ? "Defensive Wall" : /Guard|Midfielder|Shortstop/i.test(position) ? "Playmaker" : "Finisher";
      return [first, role, rank <= 10 ? "Market Heat" : "Scout Pick"];
    }

    function awardsFor(sport, rank, name){
      if(rank <= 3) return ["Global superstar tier", "MVP / Ballon d'Or conversation", "Signature collector edition"];
      if(rank <= 12) return ["League award contender", "All-star or elite team recognition", "Featured chase card"];
      if(sport === "baseball") return ["All-Star caliber profile", "Advanced-stat standout", "Postseason upside"];
      if(sport === "basketball") return ["All-NBA caliber profile", "Franchise cornerstone traits", "Playoff impact"];
      return ["International-level profile", "Club cornerstone traits", "Major competition upside"];
    }

    function recordsFor(sport, rank, name){
      const headline = rank <= 5 ? "Historic pace / generational profile" : rank <= 18 ? "Elite single-season and playoff indicators" : "Rising or established top-50 profile";
      return [headline, `${name} card record tracked by demo oracle history`, "Official record verification pending"];
    }

    function highlightsFor(card){
      return [
        `${card.playerName} is modeled as a top-tier ${card.position} in ${card.league}.`,
        `The card tracks ${Sports[card.sport]?.label || card.sport} performance signals, special-event badges and metadata versions.`,
        `Collector demand is weighted by rarity, market heat, skill tags and social influence.`
      ];
    }

    function summaryFor(card){
      return `${card.playerName} is positioned as a premium ${card.sport} collectible from ${card.team}, combining performance identity, market heat, rarity and dynamic metadata into one evolving player card.`;
    }

    function biographyFor(card){
      const sportLabel = Sports[card.sport]?.label || card.sport;
      return [
        `${card.playerName} enters this Dynamic NFT database as a ${nationalityText(card.nationality)} ${sportLabel} star associated with ${card.team} in ${card.league}. The profile is structured like an official player page: background fields, team context, performance identity, awards, records and source notes are kept together so the card can be used for presentation and future verification.`,
        `Early-career details such as birth date, birth place, height and weight are intentionally marked pending when they have not been verified from official league or club sources in this local build. The card still preserves the data slots so a production version can replace demo text with licensed, audited biography copy.`,
        `Professionally, this card emphasizes the player's role as ${card.position}. The front card highlights OVR, major skills and live market signals, while the detail modal keeps longer career story, awards, records, play style and collector value analysis.`,
        `As a collectible, ${card.playerName} is valuable because the card can evolve. Oracle events may upgrade stats, ability ratings, market heat, rarity and metadata history, turning a static player profile into a dynamic digital artwork with an auditable transaction trail.`
      ].join("\n\n");
    }

    function playStyleFor(card){
      const skills = (card.skills || []).join(", ");
      return `${card.playerName} is represented as a ${card.position} whose card identity centers on ${skills || "elite fundamentals"}. The ability model balances performance traits with collectible readability rather than claiming live scouting accuracy.`;
    }

    function collectorTextFor(card){
      return `Collectors may value this card for name recognition, ${Rarity[card.rarity]?.label || card.rarity} scarcity, ${card.abilityStats?.marketHeat || 70} market heat and its ability to record event-driven upgrades. Risk remains tied to licensing, live-data verification and market volatility.`;
    }

    function officialSourcesFor(card){
      const links = VerifiedSocials[card.playerName] || {};
      return [
        {label:"League / team profile", url:links.leagueProfile || links.teamProfile || card.metadata?.sourceUrl || leagueHub(card.sport), status:links.leagueProfile || links.teamProfile ? "verified seed link" : "pending official verification"},
        {label:"Social accounts", url:links.instagram || links.x || "", status:links.instagram || links.x ? "seed social link" : "pending official verification"},
        {label:"Data source status", url:"", status:card.sourceStatus || "demo; needs source verification"}
      ];
    }

    function marketDataFor(card){
      const heat = card.abilityStats?.marketHeat || 70;
      return {
        primary:true,
        listingType:card.owner ? "secondary" : "primary",
        listed:false,
        askingPrice:Number((card.price * (Rarity[card.rarity]?.multiplier || 1)).toFixed(2)),
        floorPrice:Number((card.price * .82).toFixed(2)),
        lastSale:Number((card.price * .96).toFixed(2)),
        volume:Number((card.price * (3 + heat / 11)).toFixed(2)),
        owner:card.owner || "issuer",
        creatorRoyalty:5,
        gasFee:Number((.002 + heat / 100000).toFixed(4)),
        marketHeat:heat,
        socialInfluence:clamp(50 + (card.socialLinks && Object.values(card.socialLinks).filter(Boolean).length * 9) + (card.abilityStats?.ovr || 75) / 4, 35, 99),
        collectorDemand:clamp(55 + (Rarity[card.rarity]?.weight || 1) * 7 + heat / 6, 40, 99),
        watchlisted:false,
        offers:[],
        priceHistory:[]
      };
    }

    function emptySocialLinks(){
      return {instagram:"", x:"", facebook:"", youtube:"", tiktok:"", officialWebsite:"", leagueProfile:"", teamProfile:""};
    }

    function leagueHub(sport){
      if(sport === "basketball") return "https://www.nba.com/players";
      if(sport === "baseball") return "https://www.mlb.com/players";
      return "https://www.fifa.com/";
    }

    function teamColors(team, sport){
      const palette = [["#3fd0c9","#e6b85c"],["#6aa7ff","#f7f2e8"],["#e55d4f","#e6b85c"],["#b590ff","#3fd0c9"],["#78c66d","#e6b85c"]];
      return palette[Math.abs(hashCode(team + sport)) % palette.length];

        Object.entries(card.stats || {}).forEach(([key, value]) => attrs.push({category:"stats", trait_type:StatLabels[key] || key, value:formatStat(key, value)}));
        Object.entries(card.abilityStats || {}).forEach(([key, value]) => attrs.push({category:"abilityStats", trait_type:key, value}));
        (card.skills || []).forEach((skill) => attrs.push({category:"skills", trait_type:"skill", value:skill}));
        (card.badges || []).forEach((badge) => attrs.push({category:"history", trait_type:"badge", value:badge}));
        Object.entries(card.socialLinks || {}).filter(([, value]) => value).forEach(([key, value]) => attrs.push({category:"social", trait_type:key, value}));
        return {
          token_id:card.tokenId,
          name:`${card.playerName} Dynamic Player Card`,
          description:`A classroom Dynamic NFT prototype card for ${card.playerName}. Manual oracle events update stats, rarity, badges and card metadata.`,
          image:card.imageUrl,
          animation_url:card.metadata?.animationUrl || `dsp-player-card-v2.html#${card.id}`,
          external_url:card.metadata?.sourceUrl || "",
          tokenURI:card.metadata?.tokenURI || `ipfs://demo/dynamic-player-card/${card.tokenId}`,
          sport:sport.label,
          player_name:card.playerName,
          team:card.team,
          league:card.league,
          owner:card.owner || "unminted",
          nationality:card.nationality,
          rarity:Rarity[card.rarity]?.label || card.rarity,
          season:"2025-26 / demo snapshot",
          attributes:attrs,
          skills:card.skills || [],
          abilityStats:card.abilityStats || {},
          socialLinks:card.socialLinks || emptySocialLinks(),
          marketData:card.marketData || {},
          last_update:card.lastUpdate,
          data_source:card.metadata?.dataSource || SOURCE_NOTE,
          transaction_history:card.history || [],
          metadata_versions:card.metadataVersions || [],
          source_status:card.sourceStatus || "demo; pending official verification",
          license_note:card.licenseNote
        };
      }
    };

    const EventSets = {
      soccer:[
        {id:"goal", icon:"G", title:"進球 +1", impact:"goals +1，解鎖進球光效", effect:"goal", apply(card){
          inc(card,"goals",1); inc(card,"shots",3); addBadge(card,"Goal Spark"); promote(card,"rare");
        }},
        {id:"hat_trick", icon:"HT", title:"帽子戲法", impact:"單場三球，升級 Special Edition", effect:"award", apply(card){
          inc(card,"goals",3); inc(card,"shots",7); addBadge(card,"Hat Trick"); promote(card,"epic"); card.status = "Special Edition";
        }},
        {id:"assist", icon:"A", title:"關鍵助攻", impact:"assists +1，提升傳球資料", effect:"goal", apply(card){
          inc(card,"assists",1); inc(card,"passPct",.3); addBadge(card,"Key Assist");
        }}
      ],
      basketball:[
        {id:"thirty", icon:"30", title:"單場 30+ 得分", impact:"得分能力值上升，新增高光徽章", effect:"award", apply(card){
          inc(card,"points",1.1); inc(card,"fgPct",.4); addBadge(card,"30+ Night"); promote(card,"rare");
        }},
        {id:"triple_double", icon:"TD", title:"大三元", impact:"三項數據達雙位數，升級金色光效", effect:"award", apply(card){
          inc(card,"points",.8); inc(card,"rebounds",.7); inc(card,"assists",.8); addBadge(card,"Triple-Double"); promote(card,"epic"); card.status = "Special Edition";
        }},
        {id:"clutch", icon:"CL", title:"絕殺時刻", impact:"解鎖 Clutch 徽章與版本紀錄", effect:"goal", apply(card){
          inc(card,"points",.5); addBadge(card,"Clutch Shot"); promote(card,"epic");
        }}
      ],
      baseball:[
        {id:"homer", icon:"HR", title:"全壘打", impact:"HR +1，火焰球軌與價值提升", effect:"homer", apply(card){
          inc(card,"homeRuns",1); inc(card,"rbi",2); inc(card,"ops",.006); addBadge(card,"Home Run"); promote(card,"rare");
        }},
        {id:"no_hitter", icon:"NH", title:"無安打紀錄", impact:"投手紀錄版，稀有度升級", effect:"award", apply(card){
          card.stats.era = Number(Math.max(0, Number(card.stats.era ?? 2.8) - .08).toFixed(2));
          card.stats.whip = Number(Math.max(.4, Number(card.stats.whip ?? 1.05) - .03).toFixed(2));
          inc(card,"strikeouts",8); addBadge(card,"No-Hitter Edition"); promote(card,"epic"); card.status = "Record Edition";
        }},
        {id:"walkoff", icon:"WO", title:"再見安打", impact:"解鎖 Walk-off 徽章", effect:"homer", apply(card){
          inc(card,"rbi",1); inc(card,"ops",.004); addBadge(card,"Walk-off"); promote(card,"epic");
        }}
      ],
      global:[
        {id:"transfer", icon:"TR", title:"轉隊 / 版本更新", impact:"隊名改為 Special Edition，記錄 team 欄位變化", effect:"goal", apply(card){
          card.previousTeam = card.previousTeam || card.team;
          card.team = `${card.team} Special Edition`;
          card.league = `${card.league} Update`;
          card.status = "Team Updated";
          addBadge(card,"Team Update");
        }},
        {id:"injury", icon:"IN", title:"受傷狀態", impact:"status 更新為 Injured，metadata 即時反映", effect:"injury", apply(card){
          card.status = "Injured";
          addBadge(card,"Injury Watch");
        }},
        {id:"award", icon:"MV", title:"MVP / 冠軍", impact:"解鎖獎項徽章，至少升級 Legendary", effect:"award", apply(card){
          addBadge(card,"MVP / Champion"); promote(card,"legendary"); card.status = "Award Edition";
        }}
      ]
    };

    function formatStat(key, value){
      const number = Number(value);
      if(["avg","ops","whip"].includes(key)) return number.toFixed(3).replace(/^0/,"");
      if(["passPct","fgPct"].includes(key)) return `${number.toFixed(1)}%`;
      if(["points","rebounds","assists","steals","blocks","era"].includes(key)) return number.toFixed(1);
      return Number.isFinite(number) ? String(Math.round(number)) : String(value ?? "-");
    }

    function inc(card, key, amount){
      const current = Number(card.stats?.[key] ?? 0);
      const next = current + amount;
      const decimals = ["avg","ops","whip"].includes(key) ? 3 : ["points","rebounds","assists","steals","blocks","fgPct","passPct","era"].includes(key) ? 1 : 0;
      card.stats[key] = Number(next.toFixed(decimals));
    }

    function addBadge(card, badge){
      card.badges = Array.isArray(card.badges) ? card.badges : [];
      if(!card.badges.includes(badge)) card.badges.unshift(badge);
      card.badges = card.badges.slice(0, 8);
    }

    function promote(card, target){
      const currentIndex = rarityOrder.indexOf(card.rarity);
      const targetIndex = rarityOrder.indexOf(target);
      if(targetIndex > currentIndex) card.rarity = target;
    }

    function snapshotCard(card){
      return {
        stats:clone(card.stats || {}),
        abilityStats:clone(card.abilityStats || {}),
        rarity:card.rarity,
        value:ValueModel.estimate(card),
        version:card.version
      };
    }

    function applyOracleBoost(card, event){
      card.abilityStats = card.abilityStats || abilityFor(card.sport, card.position, card.rarity, 25);
      card.marketData = card.marketData || marketDataFor(card);
      const boost = event.id === "injury" ? -3 : event.id === "transfer" ? 2 : event.id === "award" ? 6 : event.id === "triple_double" || event.id === "hat_trick" || event.id === "no_hitter" ? 5 : 3;
      card.abilityStats.marketHeat = clamp((card.abilityStats.marketHeat || 60) + boost * 2, 1, 99);
      card.abilityStats.clutch = clamp((card.abilityStats.clutch || 60) + (event.id === "injury" ? -2 : boost), 1, 99);
      card.abilityStats.potential = clamp((card.abilityStats.potential || 60) + (boost > 3 ? 1 : 0), 1, 99);
      card.abilityStats.ovr = clamp((card.abilityStats.ovr || 70) + (boost > 4 ? 1 : 0) + (event.id === "injury" ? -1 : 0), 1, 99);
      card.marketData.marketHeat = card.abilityStats.marketHeat;
      card.marketData.collectorDemand = clamp((card.marketData.collectorDemand || 60) + boost, 1, 99);
      card.marketData.recentEventBoost = boost;
      if(event.id === "award") promote(card,"legendary");
      if(event.id === "no_hitter" || event.id === "hat_trick" || event.id === "triple_double") promote(card,"mythic");
    }

    function buildOracleDiff(card, event, before){
      const after = snapshotCard(card);
      const changes = [];
      Object.keys({...before.stats, ...after.stats}).forEach((key) => {
        if(String(before.stats[key]) !== String(after.stats[key])) changes.push({type:"stat", key, before:formatStat(key, before.stats[key] ?? 0), after:formatStat(key, after.stats[key] ?? 0)});
      });
      ["ovr","marketHeat","potential","clutch"].forEach((key) => {
        if(before.abilityStats[key] !== after.abilityStats[key]) changes.push({type:"ability", key, before:before.abilityStats[key], after:after.abilityStats[key]});
      });
      if(before.rarity !== after.rarity) changes.push({type:"rarity", key:"rarity", before:Rarity[before.rarity]?.label || before.rarity, after:Rarity[after.rarity]?.label || after.rarity});
      changes.push({type:"market", key:"estimatedValue", before:`${money(before.value)} ETH`, after:`${money(after.value)} ETH`});
      return {
        status:["Pending","Verifying","Confirmed","Metadata Updated"],
        payload:{
          eventType:event.id,
          playerId:card.id,
          playerName:card.playerName,
          source:"Manual Oracle Demo",
          verified:true,
          timestamp:nowISO(),
          changes,
          metadataVersion:card.version + 1,
          oracleStatus:"Metadata Updated",
          txHash:`0xora${Date.now().toString(16)}`
        },
        changes
      };
    }

    const Actions = {
      mint(cardId){
        const card = Store.card(cardId);
        if(!card) return UI.toast("找不到卡片", "此卡片不存在。", "NO");
        if(card.owner === "demo_wallet") return UI.toast("已在收藏庫", `${card.playerName} 已完成 Mint。`, "OK");
        if(Store.state.wallet < card.price) return UI.toast("餘額不足", "Demo Wallet ETH 不足，無法購買。", "!");
        Store.state.wallet = Number((Store.state.wallet - card.price).toFixed(4));
        card.owner = "demo_wallet";
        card.marketData = card.marketData || marketDataFor(card);
        card.marketData.owner = "demo_wallet";
        card.marketData.listed = false;
        card.marketData.lastSale = Number(card.price);
        card.marketData.volume = Number(((card.marketData.volume || 0) + Number(card.price)).toFixed(2));
        card.marketData.priceHistory = card.marketData.priceHistory || [];
        card.marketData.priceHistory.unshift({at:nowISO(), type:"Mint", price:Number(card.price), status:"Confirmed"});
        card.version += 1;
        card.lastUpdate = nowISO();
        card.history = card.history || [];
        const receipt = tradeReceipt("MINT", "issuer", "demo_wallet", card.price);
        card.history.unshift({at:card.lastUpdate, type:"MINT", note:`Minted from primary market for ${money(card.price)} ETH.`, receipt});
        Store.state.lastTradeReceipt = receipt;
        Store.state.activeOracleId = Store.state.activeOracleId || card.id;
        this.log("MINT", card, `一級市場 Mint：${card.playerName}`, -card.price);
        Store.save();
        UI.render();
        UI.toast("購買成功", `${card.playerName} 已加入收藏庫。`, "OK");
      },
      burn(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return;
        const refund = Number((ValueModel.estimate(card) * .52).toFixed(4));
        Store.state.wallet = Number((Store.state.wallet + refund).toFixed(4));
        card.owner = null;
        card.marketData = card.marketData || marketDataFor(card);
        card.marketData.owner = "issuer";
        card.marketData.listed = false;
        card.version += 1;
        card.lastUpdate = nowISO();
        card.history.unshift({at:card.lastUpdate, type:"DEMO_RETURN", note:`Demo return redeemed ${refund} ETH.`});
        this.log("DEMO_RETURN", card, `Demo 回收：${card.playerName}`, refund);
        if(Store.state.activeOracleId === card.id) Store.state.activeOracleId = Store.ownedCards()[0]?.id || null;
        Store.save();
        UI.render();
        UI.toast("已回收", `${card.playerName} 已從收藏庫移回市場。`, "OK");
      },
      sendOracle(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return UI.toast("尚未收藏", "請先 Mint 卡片再送入預言機。", "!");
        Store.state.activeOracleId = card.id;
        Store.state.activeView = "oracle";
        Store.save();
        UI.render();
      },
      oracleEvent(eventId){
        const card = Store.card(Store.state.activeOracleId);
        if(!card || card.owner !== "demo_wallet") return UI.toast("未選擇卡片", "請先選擇收藏庫中的卡片。", "!");
        const event = [...(EventSets[card.sport] || []), ...EventSets.global].find((item) => item.id === eventId);
        if(!event) return;
        const beforeSnapshot = snapshotCard(card);
        const before = Metadata.forCard(card);
        event.apply(card);
        applyOracleBoost(card, event);
        card.version += 1;
        card.lastUpdate = nowISO();
        card.history = card.history || [];
        card.history.unshift({
          at:card.lastUpdate,
          type:`ORACLE_${event.id.toUpperCase()}`,
          note:`${event.title} applied. Metadata v${card.version} generated from manual oracle input.`
        });
        Store.state.lastEffect = {cardId:card.id, effect:event.effect, at:Date.now()};
        Store.state.lastOracleDiff = buildOracleDiff(card, event, beforeSnapshot);
        card.metadataVersions = card.metadataVersions || [];
        card.metadataVersions.unshift({version:card.version, at:card.lastUpdate, reason:event.title, diff:Store.state.lastOracleDiff.changes});
        this.log("ORACLE", card, `${event.title} 更新：${before.rarity} -> ${Rarity[card.rarity]?.label || card.rarity}`, 0);
        Store.save();
        UI.render();
        UI.toast("預言機已更新", `${card.playerName} v${card.version} metadata 已刷新。`, "OK");
      },
      buyNow(cardId){
        return this.mint(cardId);
      },
      listForSale(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return UI.toast("尚未收藏", "只有收藏庫中的卡片可以掛單。", "!");
        card.marketData = card.marketData || marketDataFor(card);
        card.marketData.listed = true;
        card.marketData.listingType = "secondary";
        card.marketData.askingPrice = Number((ValueModel.estimate(card) * 1.06).toFixed(2));
        card.history.unshift({at:nowISO(), type:"LIST_FOR_SALE", note:`Listed for ${money(card.marketData.askingPrice)} ETH.`});
        this.log("LIST", card, `掛單出售：${card.playerName} ${money(card.marketData.askingPrice)} ETH`, 0);
        Store.save();
        UI.render();
        UI.toast("已掛單", `${card.playerName} 已進入二級市場。`, "OK");
      },
      cancelListing(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return;
        card.marketData = card.marketData || marketDataFor(card);
        card.marketData.listed = false;
        card.history.unshift({at:nowISO(), type:"CANCEL_LISTING", note:"Owner cancelled the secondary market listing."});
        this.log("CANCEL_LISTING", card, `取消掛單：${card.playerName}`, 0);
        Store.save();
        UI.render();
        UI.toast("已取消掛單", `${card.playerName} 回到收藏庫未出售狀態。`, "OK");
      },
      makeOffer(cardId){
        const card = Store.card(cardId);
        if(!card) return;
        card.marketData = card.marketData || marketDataFor(card);
        const price = Number((ValueModel.estimate(card) * (.86 + Math.random() * .1)).toFixed(2));
        const offer = {id:uid("offer"), from:`collector_${Math.floor(1000 + Math.random() * 8999)}`, price, at:nowISO(), status:"Pending"};
        card.marketData.offers = card.marketData.offers || [];
        card.marketData.offers.unshift(offer);
        card.history.unshift({at:offer.at, type:"MAKE_OFFER", note:`${offer.from} offered ${money(price)} ETH.`});
        this.log("OFFER", card, `收到出價：${money(price)} ETH`, 0);
        Store.save();
        UI.render();
        UI.toast("已產生出價", `${card.playerName} 收到 ${money(price)} ETH 模擬出價。`, "OK");
      },
      acceptOffer(cardId){
        const card = Store.card(cardId);
        if(!card || card.owner !== "demo_wallet") return UI.toast("無法接受", "只有持有者可以接受出價。", "!");
        const offer = (card.marketData?.offers || []).find((item) => item.status === "Pending");
        if(!offer) return UI.toast("沒有待接受出價", "請先用 Make Offer 產生模擬出價。", "!");
        offer.status = "Accepted";
        const gas = Number((card.marketData?.gasFee || .003).toFixed(4));
        Store.state.wallet = Number((Store.state.wallet + offer.price - gas).toFixed(4));
        const receipt = tradeReceipt("SECONDARY_SALE", "demo_wallet", offer.from, offer.price, gas);
        card.owner = offer.from;
        card.marketData.owner = offer.from;
        card.marketData.listed = false;
        card.marketData.lastSale = offer.price;
        card.marketData.volume = Number(((card.marketData.volume || 0) + offer.price).toFixed(2));
        card.marketData.priceHistory.unshift({at:nowISO(), type:"Sale", price:offer.price, status:"Confirmed"});
        card.history.unshift({at:nowISO(), type:"ACCEPT_OFFER", note:`Accepted ${money(offer.price)} ETH offer from ${offer.from}.`, receipt});
        Store.state.lastTradeReceipt = receipt;
        this.log("SALE", card, `接受出價並完成二級市場成交：${money(offer.price)} ETH`, offer.price);
        Store.save();
        UI.render();
        UI.toast("交易確認", `${card.playerName} 已完成模擬鏈上成交。`, "TX");
      },
      toggleWatch(cardId){
        Store.state.watchlist = Store.state.watchlist || [];
        if(Store.state.watchlist.includes(cardId)){
          Store.state.watchlist = Store.state.watchlist.filter((id) => id !== cardId);
        }else{
          Store.state.watchlist.push(cardId);
        }
        const card = Store.card(cardId);
        if(card){
          card.marketData = card.marketData || marketDataFor(card);
          card.marketData.watchlisted = Store.state.watchlist.includes(cardId);
        }
        Store.save();
        UI.render();
      },
      loadMore(){
        Store.state.visibleCount = Math.min(Store.state.visibleCount + 24, Store.marketCards().length);
        Store.save();
        UI.renderMarket();
      },
      log(type, card, note, delta){
        Store.state.txLog.unshift({
          id:uid("tx"),
          at:nowISO(),
          type,
          tokenId:card?.tokenId || "-",
          cardName:card?.playerName || "-",
          note,
          delta:Number(delta || 0)
        });
        Store.state.txLog = Store.state.txLog.slice(0, 80);
      }
    };

    const UI = {
      toastTimer:null,
      init(){
        Store.load();
        if(!Store.state.activeOracleId){
          Store.state.activeOracleId = Store.ownedCards()[0]?.id || null;
        }
        this.bind();
        this.render();
      },
      bind(){
        document.addEventListener("click", (event) => {
          const viewTarget = event.target.closest("[data-view]");
          if(viewTarget){
            this.setView(viewTarget.dataset.view);
            return;
          }
          const action = event.target.closest("[data-action]");
          if(!action) return;
          const id = action.dataset.cardId;
          switch(action.dataset.action){
            case "buy": Actions.mint(id); break;
            case "buy-now": Actions.buyNow(id); break;
            case "make-offer": Actions.makeOffer(id); break;
            case "list-sale": Actions.listForSale(id); break;
            case "cancel-listing": Actions.cancelListing(id); break;
            case "accept-offer": Actions.acceptOffer(id); break;
            case "watch": Actions.toggleWatch(id); break;
            case "load-more": Actions.loadMore(); break;
            case "burn": Actions.burn(id); break;
            case "detail": this.openDetail(id); break;
            case "oracle": Actions.sendOracle(id); break;
            case "oracle-event": Actions.oracleEvent(action.dataset.eventId); break;
            case "copy-json": this.copyMetadata(); break;
            case "download-json": this.downloadMetadata(); break;
            case "export-state": this.exportState(); break;
            case "reset-demo": this.resetDemo(); break;
            case "close-modal": this.closeModal(); break;
            case "add-card": this.addCustomCard(action.dataset.target || "market"); break;
          }
        });
        document.addEventListener("input", (event) => {
          if(event.target.id === "marketSearch"){
            Store.state.search = event.target.value;
            Store.state.visibleCount = 24;
            Store.save();
            this.renderMarket();
          }
        });
        document.addEventListener("change", (event) => {
          if(event.target.id === "filterSport"){
            Store.state.filterSport = event.target.value;
            Store.state.visibleCount = 24;
            Store.save();
            this.renderMarket();
          }
          if(event.target.id === "filterLeague"){
            Store.state.filterLeague = event.target.value;
            Store.state.visibleCount = 24;
            Store.save();
            this.renderMarket();
          }
          if(event.target.id === "filterRarity"){
            Store.state.filterRarity = event.target.value;
            Store.state.visibleCount = 24;
            Store.save();
            this.renderMarket();
          }
          if(event.target.id === "sortBy"){
            Store.state.sortBy = event.target.value;
            Store.save();
            this.renderMarket();
          }
          if(event.target.id === "oraclePicker"){
            Store.state.activeOracleId = event.target.value;
            Store.save();
            this.render();
          }
          if(event.target.id === "studioSport"){
            this.renderStudioStats(event.target.value);
          }
        });
        $("#detailModal").addEventListener("click", (event) => {
          if(event.target.id === "detailModal") this.closeModal();
        });
        document.addEventListener("keydown", (event) => {
          if(event.key === "Escape") this.closeModal();
        });
      },
      setView(view){
        if(!Views.some((item) => item.id === view)) return;
        Store.state.activeView = view;
        Store.save();
        this.render();
      },
      render(){
        const view = Views.find((item) => item.id === Store.state.activeView) || Views[0];
        $("#pageIcon").textContent = view.icon;
        $("#pageTitle").textContent = view.title;
        $("#pageSubtitle").textContent = view.subtitle;
        $("#nav").innerHTML = Views.map((item) => `
          <button class="nav-btn ${item.id === view.id ? "active" : ""}" data-view="${item.id}">
            <span class="nav-ico">${item.icon}</span>
            <span><strong>${item.nav}</strong><small>${item.sub}</small></span>
          </button>
        `).join("");
        $$(".view").forEach((node) => node.classList.remove("active"));
        $(`#view-${view.id}`)?.classList.add("active");
        $("#walletBalance").textContent = money(Store.state.wallet);
        $("#walletMeter").style.width = `${clamp(Store.state.wallet / 12.5 * 100, 7, 100)}%`;
        $("#collectionBadge").textContent = `${Store.ownedCards().length} CARDS`;
        this.renderTopActions();
        if(view.id === "dashboard") this.renderDashboard();
        if(view.id === "market") this.renderMarket();
        if(view.id === "collection") this.renderCollection();
        if(view.id === "oracle") this.renderOracle();
        if(view.id === "datahub") this.renderDataHub();
        if(view.id === "studio") this.renderStudio();
      },
      renderTopActions(){

                <tr><td>加入收藏庫</td><td>建立後立即 owner = demo_wallet，適合直接測試 Oracle</td></tr>
              </table>
              <div class="notice mt-14">自訂卡預設使用自製概念資料，較適合避開肖像權與商標風險。</div>
            </article>
          </section>
        `;
        this.renderStudioStats("soccer");
      },
      renderStudioStats(sportId){
        const sport = Sports[sportId] || Sports.soccer;
        const statsBox = $("#studioStats");
        if(!statsBox) return;
        statsBox.innerHTML = sport.stats.slice(0, 6).map((key) => {
          const value = sport.defaultStats[key] ?? 0;
          return field(`stat_${key}`, StatLabels[key] || key, value, "number", key === "avg" || key === "ops" ? "0.001" : "0.1", "");
        }).join("");
      },
      cardHTML(card, context = "market"){
        const sport = Sports[card.sport] || Sports.soccer;
        const rarity = Rarity[card.rarity] || Rarity.common;
        const owned = card.owner === "demo_wallet";
        const effect = Store.state.lastEffect?.cardId === card.id && Date.now() - Store.state.lastEffect.at < 1800 ? `effect-${Store.state.lastEffect.effect}` : "";
        const visibleStats = sport.stats.filter((key) => key in (card.stats || {})).slice(0, 3);
        const statusClass = card.status === "Injured" ? "warning" : /Edition|Updated/.test(card.status || "") ? "special" : "";
        const teamA = card.teamColors?.[0] || sport.tone;
        const teamB = card.teamColors?.[1] || rarity.color;
        const watched = Store.state.watchlist?.includes(card.id);
        const actions = context === "collection" ? `
          <button class="btn teal" data-action="oracle" data-card-id="${card.id}">送入預言機</button>
          <button class="btn" data-action="detail" data-card-id="${card.id}">詳情</button>
          <button class="btn" data-action="${card.marketData?.listed ? "cancel-listing" : "list-sale"}" data-card-id="${card.id}">${card.marketData?.listed ? "取消掛單" : "掛單"}</button>
        ` : context === "oracle" ? `
          <button class="btn" data-action="detail" data-card-id="${card.id}">完整資料</button>
          <a class="btn" href="${escapeAttr(card.metadata?.sourceUrl || "#")}" target="_blank" rel="noreferrer">來源頁</a>
        ` : `
          <button class="btn primary" data-action="${owned ? "detail" : "buy-now"}" data-card-id="${card.id}">${owned ? "已擁有" : (card.marketData?.listed ? "Buy Now" : "Mint")}</button>
          <button class="btn" data-action="make-offer" data-card-id="${card.id}">出價</button>
          <button class="btn" data-action="detail" data-card-id="${card.id}">詳情</button>
        `;
        const imageClass = card.imageUrl ? "media-frame" : "media-frame is-fallback";
        return `
          <article class="player-card ${effect}" data-card-id="${card.id}" style="--team-a:${teamA};--team-b:${teamB};--rarity-color:${rarity.color}">
            <div class="card-topline">
              <span class="serial">${escapeHTML(card.tokenId)} | ${escapeHTML(card.serial)}</span>
              <span class="rarity-pill">${escapeHTML(rarity.label)}</span>
            </div>
            <div class="${imageClass}">
              ${card.imageUrl ? `<img class="player-img" alt="${escapeAttr(card.playerName)}" src="${escapeAttr(card.imageUrl)}" loading="lazy" onerror="this.closest('.media-frame').classList.add('is-fallback');this.remove();" />` : ""}
              <div class="fallback-initials">${escapeHTML(initials(card.playerName))}</div>
              <div class="media-label">
                <span class="source-pill">${escapeHTML(sport.label)}</span>
                <span class="status-pill ${statusClass}">${escapeHTML(card.status || "Active")}</span>
              </div>
              <div class="team-logo ${card.logoUrl ? "" : "logo-failed"}" data-code="${escapeAttr(card.teamCode || sport.short)}">
                ${card.logoUrl ? `<img alt="${escapeAttr(card.team)} logo" src="${escapeAttr(card.logoUrl)}" loading="lazy" onerror="this.closest('.team-logo').classList.add('logo-failed');this.remove();" />` : ""}
              </div>
            </div>
            <div class="card-body">
              <div class="name-row">
                <div>
                  <h4 class="player-name">${escapeHTML(card.playerName)}</h4>
                  <div class="team-line">${escapeHTML(card.team)} | ${escapeHTML(card.league)} | ${escapeHTML(card.position)}</div>
                </div>
                <div class="number-chip">#${escapeHTML(card.jerseyNumber)}</div>
              </div>
              <div class="ability-head">
                <div class="ovr"><span>OVR</span><b>${card.abilityStats?.ovr || "-"}</b></div>
                <div class="ability-mini">
                  ${["attack","speed","skill"].map((key) => `<span>${key.toUpperCase()} <b>${card.abilityStats?.[key] || "-"}</b></span>`).join("")}
                </div>
                <button class="icon-btn watch-btn ${watched ? "active" : ""}" data-action="watch" data-card-id="${card.id}" title="Watchlist">${watched ? "★" : "☆"}</button>
              </div>
              <div class="badge-row">
                ${(card.badges || []).slice(0, 4).map((badge) => `<span class="badge">${escapeHTML(badge)}</span>`).join("") || `<span class="badge">BASE CARD</span>`}
              </div>
              <div class="skill-row">
                ${(card.skills || []).slice(0, 4).map((skill) => `<span>${escapeHTML(skill)}</span>`).join("")}
              </div>
              <div class="stats">
                ${visibleStats.map((key) => `
                  <div class="stat-box"><span>${escapeHTML(StatLabels[key] || key)}</span><b>${escapeHTML(formatStat(key, card.stats[key]))}</b></div>
                `).join("")}
              </div>
              <div class="value-row"><span>v${card.version} | ${owned ? "demo_wallet" : (card.marketData?.listed ? "secondary" : "primary")}</span><b>${money(ValueModel.estimate(card))} ETH</b></div>
              <div class="card-actions three">${actions}</div>
            </div>
          </article>
        `;
      },
      logHTML(item){
        return `
          <div class="log-line">
            <b>${escapeHTML(item.type || "LOG")} | ${escapeHTML(formatDate(item.at))}</b>
            ${escapeHTML(item.note || item.cardName || "")}
          </div>
        `;
      },
      openDetail(cardId){
        const card = Store.card(cardId);
        if(!card) return;
        $("#modalTitle").textContent = `${card.playerName} | ${card.tokenId}`;
        const meta = Metadata.forCard(card);
        const valuation = ValueModel.breakdown(card);
        $("#modalBody").innerHTML = `
          <div class="detail-grid">
            <div>${this.cardHTML(card, card.owner === "demo_wallet" ? "collection" : "market")}</div>
            <div class="grid">
              <article class="panel panel-pad">
                <h3>Card Data</h3>
                <div class="kv-grid mt-14">
                  ${[
                    ["sport", Sports[card.sport]?.label],
                    ["team", card.team],
                    ["league", card.league],
                    ["nationality", card.nationality],
                    ["rarity", Rarity[card.rarity]?.label],
                    ["status", card.status],
                    ["owner", card.owner || "unminted"],
                    ["last_update", formatDate(card.lastUpdate)]
                  ].map(([key, value]) => `<div class="kv"><span>${key}</span><b>${escapeHTML(value)}</b></div>`).join("")}
                </div>
              </article>
              <article class="panel panel-pad">
                <h3>Career Story</h3>
                <p class="story-text">${escapeHTML(card.biography || card.careerSummary || "")}</p>
                <div class="grid cols-2 mt-14">
                  <div>${listBlock("Career Highlights", card.careerHighlights)}</div>
                  <div>${listBlock("Major Awards", card.majorAwards)}</div>
                  <div>${listBlock("Records", card.records)}</div>
                  <div>${listBlock("Skills", card.skills)}</div>
                </div>
              </article>
              <article class="panel panel-pad">
                <h3>Ability System</h3>
                <div class="ability-bars mt-14">
                  ${Object.entries(card.abilityStats || {}).map(([key, value]) => `<div class="bar-row"><span>${escapeHTML(key)}</span><b>${escapeHTML(value)}</b><i style="width:${clamp(Number(value), 0, 100)}%"></i></div>`).join("")}
                </div>
              </article>
              <article class="panel panel-pad">
                <h3>Collector Value Analysis</h3>
                <p>${escapeHTML(card.collectorValue)}</p>
                <div class="valuation-grid mt-14">
                  ${[
                    ["Base Price", money(valuation.basePrice)],
                    ["Rarity Multiplier", `${valuation.rarityMultiplier.toFixed(2)}x`],
                    ["Performance Score", valuation.performanceScore.toFixed(2)],
                    ["Social Influence", valuation.socialInfluence.toFixed(2)],
                    ["Market Heat", valuation.marketHeat.toFixed(2)],
                    ["Collector Demand", valuation.collectorDemand.toFixed(2)],
                    ["Recent Event Boost", valuation.recentEventBoost.toFixed(2)],
                    ["Estimated Value", `${money(valuation.estimatedValue)} ETH`]
                  ].map(([k,v]) => `<div><span>${escapeHTML(k)}</span><b>${escapeHTML(v)}</b></div>`).join("")}
                </div>
              </article>
              <article class="panel panel-pad">
                <h3>Social & Official Sources</h3>
                <div class="social-grid mt-14">
                  ${socialLinksHTML(card)}
                </div>
                <div class="source-list mt-14">
                  ${(card.officialSources || []).map((source) => `<div><b>${escapeHTML(source.label)}</b><span>${escapeHTML(source.status)}</span>${source.url ? `<a href="${escapeAttr(source.url)}" target="_blank" rel="noreferrer">${escapeHTML(source.url)}</a>` : ""}</div>`).join("")}
                </div>
              </article>
              <article class="panel panel-pad">
                <h3>Market Data & Offers</h3>
                <div class="kv-grid mt-14">
                  ${[
                    ["Floor Price", `${money(card.marketData?.floorPrice || 0)} ETH`],
                    ["Last Sale", `${money(card.marketData?.lastSale || 0)} ETH`],
                    ["Volume", `${money(card.marketData?.volume || 0)} ETH`],
                    ["Owner", card.owner || card.marketData?.owner || "issuer"],
                    ["Creator Royalty", `${card.marketData?.creatorRoyalty || 5}%`],
                    ["Gas Fee", `${money(card.marketData?.gasFee || 0)} ETH`]
                  ].map(([key, value]) => `<div class="kv"><span>${key}</span><b>${escapeHTML(value)}</b></div>`).join("")}
                </div>
                <div class="timeline mt-14">
                  ${(card.marketData?.offers || []).slice(0, 5).map((offer) => `<div class="log-line"><b>${escapeHTML(offer.from)} | ${money(offer.price)} ETH</b>${escapeHTML(offer.status)} | ${escapeHTML(formatDate(offer.at))}</div>`).join("") || `<div class="log-line">No active offer yet.</div>`}
                </div>
                <div class="section-actions mt-14">
                  <button class="btn" data-action="make-offer" data-card-id="${card.id}">Make Offer</button>
                  <button class="btn teal" data-action="accept-offer" data-card-id="${card.id}">Accept Offer</button>
                  <button class="btn" data-action="${card.marketData?.listed ? "cancel-listing" : "list-sale"}" data-card-id="${card.id}">${card.marketData?.listed ? "Cancel Listing" : "List for Sale"}</button>
                </div>
              </article>
              <article class="panel panel-pad">
                <div class="section-head">
                  <div><h3>Metadata Version Viewer</h3><p>${escapeHTML(meta.tokenURI)} | validation: demo schema ok</p></div>
                  <div class="section-actions"><button class="btn" data-action="copy-json">Copy JSON</button><button class="btn" data-action="download-json">Download</button></div>
                </div>
                <pre class="json-box mt-14">${escapeHTML(JSON.stringify(meta, null, 2))}</pre>
              </article>
            </div>
          </div>
        `;
        $("#detailModal").classList.add("open");
      },
      closeModal(){
        $("#detailModal").classList.remove("open");
      },
      copyMetadata(){
        const card = Store.card(Store.state.activeOracleId);
        if(!card) return;
        const text = JSON.stringify(Metadata.forCard(card), null, 2);
        copyText(text).then(() => this.toast("已複製", "Metadata JSON 已複製。", "OK"));
      },
      downloadMetadata(){
        const card = Store.card(Store.state.activeOracleId);
        if(!card) return;
        downloadText(`${card.tokenId}_metadata.json`, JSON.stringify(Metadata.forCard(card), null, 2));
      },
      exportState(){
        downloadText("dynamic_player_cards_v2_state.json", JSON.stringify(Store.state, null, 2));
      },
      resetDemo(){
        Store.reset();
        this.render();
        this.toast("Demo 已重置", "Wallet、收藏庫與事件紀錄已回到初始狀態。", "OK");
      },
      addCustomCard(target){
        const sportId = $("#studioSport")?.value || "soccer";
        const sport = Sports[sportId] || Sports.soccer;
        const stats = {};
        sport.stats.forEach((key) => {
          const input = $(`#stat_${cssEscape(key)}`);
          stats[key] = Number(input?.value || sport.defaultStats[key] || 0);
        });
        const card = {
          id:uid("custom_card"),
          tokenId:`DSP-2026-CUSTOM-${String(Store.state.cards.length + 1).padStart(3,"0")}`,
          sport:sportId,
          playerName:$("#studioName").value.trim() || "CUSTOM PLAYER",
          team:$("#studioTeam").value.trim() || "Concept Team",
          teamCode:"CUS",
          league:$("#studioLeague").value.trim() || "Concept League",
          position:$("#studioPosition").value.trim() || "Player",
          jerseyNumber:$("#studioJersey").value.trim() || "0",
          nationality:$("#studioNationality").value.trim() || "Unknown",
          continent:"Custom",
          rarity:$("#studioRarity").value,
          price:Number($("#studioPrice").value || .38),
          owner:target === "collection" ? "demo_wallet" : null,
          serial:`CU-${String(Store.state.cards.length + 1).padStart(3,"0")}/999`,
          status:"Active",
          version:target === "collection" ? 2 : 1,
          lastUpdate:nowISO(),
          imageUrl:$("#studioImage").value.trim(),
          logoUrl:$("#studioLogo").value.trim(),
          teamColors:[sport.tone, Rarity[$("#studioRarity").value]?.color || "#e6b85c"],
          badges:["Custom Demo"],
          stats,
          metadata:{sourceUrl:"", dataSource:"Card Studio custom demo data.", animationUrl:"dsp-player-card-v2.html#custom"},
          history:[{at:nowISO(), type:target === "collection" ? "CUSTOM_MINT" : "CUSTOM_CREATE", note:`Card Studio created card into ${target}.`}],
          licenseNote:"Custom concept card."
        };
        enrichCard(card, Store.state.cards.length + 1);
        Store.state.cards.unshift(card);
        if(target === "collection"){
          Actions.log("CUSTOM_MINT", card, `Card Studio 直接 Mint：${card.playerName}`, 0);
          Store.state.activeOracleId = card.id;
        }
        Store.state.activeView = target === "collection" ? "collection" : "market";
        Store.save();
        this.render();
        this.toast("自訂卡已建立", `${card.playerName} 已加入${target === "collection" ? "收藏庫" : "市場"}。`, "OK");
      },
      toast(title, message, icon = "OK"){
        clearTimeout(this.toastTimer);
        $("#toastTitle").textContent = title;
        $("#toastMsg").textContent = message;
        $("#toastIcon").textContent = icon;
        $("#toast").classList.add("show");
        this.toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 3200);
      }
    };

    function option(value, label, selected){
      return `<option value="${escapeAttr(value)}" ${String(value) === String(selected) ? "selected" : ""}>${escapeHTML(label)}</option>`;
    }

    function field(id, label, value, type = "text", step = "", min = ""){
      return `
        <div class="form-field">
          <label for="${escapeAttr(id)}">${escapeHTML(label)}</label>
          <input class="field" id="${escapeAttr(id)}" type="${type}" ${step ? `step="${escapeAttr(step)}"` : ""} ${min ? `min="${escapeAttr(min)}"` : ""} value="${escapeAttr(value)}" />
        </div>
      `;
    }

    function listBlock(title, items){
      const list = Array.isArray(items) ? items : String(items || "").split(/\n|;|,/).filter(Boolean);
      return `<h4>${escapeHTML(title)}</h4><ul class="clean-list">${list.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul>`;
    }

    function socialLinksHTML(card){
      const labels = [
        ["instagram","Instagram"],["x","X / Twitter"],["facebook","Facebook"],["youtube","YouTube"],["tiktok","TikTok"],["officialWebsite","Official Website"],["leagueProfile","League Profile"],["teamProfile","Team Profile"]
      ];
      const links = labels.filter(([key]) => card.socialLinks?.[key]);
      return links.length ? links.map(([key, label]) => `<a class="social-link" href="${escapeAttr(card.socialLinks[key])}" target="_blank" rel="noreferrer">${escapeHTML(label)}</a>`).join("") : `<span class="source-pill">pending official social verification</span>`;
    }

    function initials(name){
      const parts = String(name || "CARD").replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).filter(Boolean);
      if(!parts.length) return "DC";
      if(parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return `${parts[0][0]}${parts[parts.length - 1][0]}`.toUpperCase();
    }

    function formatDate(iso){
      try{
        return new Date(iso).toLocaleString("zh-TW", {hour12:false});
      }catch(_){
        return iso || "-";
      }
    }

    function downloadText(filename, text){
      const blob = new Blob([text], {type:"application/json;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function tradeReceipt(type, from, to, price, gasFee){
      const gas = Number((gasFee ?? (.002 + Math.random() * .006)).toFixed(4));
      return {
        txHash:`0x${Math.random().toString(16).slice(2).padEnd(12,"0")}${Date.now().toString(16)}`,
        blockNumber:Math.floor(18400000 + Math.random() * 900000),
        gasFee:gas,
        from,
        to,
        price:Number(price || 0),
        status:"Confirmed",
        timestamp:nowISO(),
        type
      };
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
      }catch(_){
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
    }

    function cssEscape(value){
      if(window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
    }

    window.addEventListener("DOMContentLoaded", () => UI.init());
  })();
  </script>
</body>
</html>
